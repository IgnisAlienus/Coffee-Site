name: Deploy Website

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npm run test:client
            - run: npm run test:db
            - run: npm run check
            - run: npm run test:pages
            - run: npm run build:pages
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: .pages-dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Publish GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
